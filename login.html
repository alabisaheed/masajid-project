<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Masajid Project</title>
  <meta name="description" content="Secure Executive Control Panel Login.">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
  <link rel="canonical" href="http://masajidproject.org/">

  <style>
    body {
      background: #0F172A;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      margin: 0;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(19, 84, 122, 0.25) 0%, rgba(15, 23, 42, 0) 70%);
      top: -100px;
      right: -100px;
      pointer-events: none;
    }

    .login-card {
      background: #1E293B;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 10;
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.35rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 0.5rem;
      justify-content: center;
    }

    .login-logo i {
      color: #38BDF8;
      font-size: 1.6rem;
    }

    .login-subtitle {
      text-align: center;
      color: #94A3B8;
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #E2E8F0;
      margin-bottom: 0.4rem;
    }

    .form-input-wrapper {
      position: relative;
    }

    .form-input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #64748B;
      font-size: 0.9rem;
    }

    .login-input {
      width: 100%;
      background: #0F172A;
      border: 1.5px solid #334155;
      color: #FFFFFF;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .login-input:focus {
      outline: none;
      border-color: #38BDF8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #EF4444;
      color: #FCA5A5;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.825rem;
      margin-bottom: 1.25rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
      <i class="fa-solid fa-mosque"></i>
      <span>Masajid Project</span>
    </div>
    <div class="login-subtitle">Executive Control Panel Authentication</div>

    <div class="error-banner" id="login-error">
      <i class="fa-solid fa-circle-exclamation"></i> Invalid email address or password. Please try again.
    </div>

    <form onsubmit="handleLoginSubmit(event)" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <div class="form-input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="login-email" class="login-input" placeholder="Enter email address" required autocomplete="off">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label class="form-label" for="login-pass">Password</label>
        <div class="form-input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="login-pass" class="login-input" placeholder="Enter password" required autocomplete="new-password">
        </div>
      </div>

      <button type="submit" class="btn btn--primary" style="width: 100%; padding: 0.85rem; font-size: 0.95rem; font-weight: 800; background: #13547A;">
        Login
      </button>
    </form>
  </div>

  <script>
    const validAdmins = {
      'admin@masajidproject.org': { pass: 'MasajidAdmin#2026', name: 'Super Admin', role: 'Super Administrator' },
      'hello@masajidproject.org': { pass: 'MasajidHello#2026', name: 'Operations Admin', role: 'Operations & General Admin' },
      'support@masajidproject.org': { pass: 'MasajidSupport#2026', name: 'Support Lead', role: 'Donor Support Lead' }
    };

    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const pass = document.getElementById('login-pass').value;
      const errorBanner = document.getElementById('login-error');

      const adminAccount = validAdmins[email];

      if (adminAccount && adminAccount.pass === pass) {
        const sessionData = {
          email: email,
          name: adminAccount.name,
          role: adminAccount.role,
          loggedInAt: new Date().toISOString()
        };

        localStorage.setItem('masajid_admin_session', JSON.stringify(sessionData));
        sessionStorage.setItem('masajid_admin_session', JSON.stringify(sessionData));

        window.location.href = 'dashboard';
      } else {
        errorBanner.style.display = 'block';
      }
    }
  </script>
</body>
</html>
